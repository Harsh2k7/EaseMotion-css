<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Stepper Demo - #55260</title>
  <link rel="stylesheet" href="../../../components/stepper.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="demo-container">
    <h2>Horizontal Stepper</h2>
    <div class="ease-stepper">
      <div class="ease-step completed">
        <div class="ease-step-circle">✓</div>
        <div class="ease-step-label">Account</div>
      </div>
      <div class="ease-step active">
        <div class="ease-step-circle">2</div>
        <div class="ease-step-label">Personal Info</div>
      </div>
      <div class="ease-step">
        <div class="ease-step-circle">3</div>
        <div class="ease-step-label">Payment</div>
      </div>
      <div class="ease-step">
        <div class="ease-step-circle">4</div>
        <div class="ease-step-label">Confirmation</div>
      </div>
    </div>

    <h2 style="margin-top: 3rem;">Vertical Stepper</h2>
    <div class="ease-stepper ease-stepper-vertical">
      <div class="ease-step completed">
        <div class="ease-step-circle">✓</div>
        <div class="ease-step-label">Step 1: Complete Profile</div>
      </div>
      <div class="ease-step active">
        <div class="ease-step-circle">2</div>
        <div class="ease-step-label">Step 2: Upload Verification Documents</div>
      </div>
      <div class="ease-step">
        <div class="ease-step-circle">3</div>
        <div class="ease-step-label">Step 3: Review & Submit</div>
      </div>
    </div>
  </div>
</body>
</html>
